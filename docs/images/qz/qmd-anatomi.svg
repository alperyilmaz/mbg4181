<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Helvetica, Arial, sans-serif">
<rect x="40" y="30" width="820" height="300" rx="10" fill="#FFFFFF" stroke="#222B57" stroke-width="2"/>
<rect x="60" y="60" width="780" height="62" rx="6" fill="#222B57"/>
<text x="80" y="85" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" font-weight="bold">YAML başlık</text>
<text x="80" y="106" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#C7CEE8" font-weight="normal">başlık, yazar, format, execute ayarları — belgenin kimlik kartı</text>
<rect x="60" y="130" width="780" height="58" rx="6" fill="#F1F5F9"/>
<text x="80" y="155" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1E293B" font-weight="bold">Markdown metni</text>
<text x="80" y="176" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748B" font-weight="normal">giriş, yöntem, sonuç: sade ve okunabilir düz metin</text>
<rect x="60" y="196" width="780" height="68" rx="6" fill="#FAF6EE"/>
<text x="80" y="221" text-anchor="start" font-family="Menlo, Consolas, monospace" font-size="17" fill="#1E293B" font-weight="bold">Kod bloğu ```{r}</text>
<text x="80" y="242" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748B" font-weight="normal">R kodu + chunk seçenekleri (#| ile yazılır)</text>
<rect x="60" y="272" width="780" height="46" rx="6" fill="#ECFDF5"/>
<text x="80" y="297" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#059669" font-weight="bold">Çıktı</text>
<text x="80" y="318" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748B" font-weight="normal">render sırasında otomatik üretilir</text>
<text x="450" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#64748B" font-weight="" font-style="italic">tek dosya → metin + kod + çıktı</text>
</svg>